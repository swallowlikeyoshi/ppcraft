<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPcraft</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="PPcraft: a raw developer for Sigma Foveon X3F files, running entirely in your browser. Your photos never leave your computer.">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1c1c; }
    canvas#lightcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #lightcraft_loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #b8b8b8; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; pointer-events: none;
    }
    #lightcraft_status { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; overflow: hidden; }
  </style>
  <!-- Google Analytics (GA4), added to the public site by .github/workflows/site.yml when the repository variable
       GA_MEASUREMENT_ID is set. Page views, plus errors as `exception` events: uncaught errors, rejected promises and
       console.error (the wasm module's panics and failures). Error text has file names and paths taken out, and at
       most 20 errors are sent per visit. No photo data is sent: photos stay in the browser. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V6GZTV74K4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-V6GZTV74K4", { app_version: "v0.1.7" });
    (() => {
      let sent = 0;
      const seen = new Set();
      const scrub = (s) =>
        String(s)
          .replace(/(?<![\w.])(?:[A-Za-z]:\\|\/)[^\s"'<>]*/g, "<path>")
          .replace(/[^\s"'<>\\/]+\.(?:x3f|x3i|jpe?g|tiff?|png|dng|heic|avif|webp|cr[23w]|nef|arw|raf|orf|rw2|pef|srw)\b/gi, "<file>")
          .replace(/\s+/g, " ")
          .slice(0, 300);
      const report = (kind, text, fatal) => {
        const d = scrub(`${kind}: ${text}`);
        if (sent >= 20 || seen.has(d)) return;
        seen.add(d);
        sent++;
        gtag("event", "exception", { description: d, fatal: !!fatal, error_kind: kind, app_version: "v0.1.7" });
      };
      addEventListener("error", (e) => {
        if (e && e.message) report("error", `${e.message} @${String(e.filename || "").split("/").pop()}:${e.lineno || 0}`, true);
      });
      addEventListener("unhandledrejection", (e) => {
        const r = e && e.reason;
        report("rejection", r && r.message ? r.message : r, false);
      });
      const original = console.error.bind(console);
      console.error = (...args) => {
        try {
          report("console", args.map((a) => (a && a.message ? a.message : typeof a === "string" ? a : JSON.stringify(a))).join(" "), /panicked/.test(String(args[0])));
        } catch (_) {}
        original(...args);
      };
    })();
  </script>
</head>
<body>
  <canvas id="lightcraft_canvas"></canvas>
  <div id="lightcraft_loading">Loading PPcraft…</div>
  <div id="lightcraft_status" aria-live="polite"></div>
  <script type="module">
    import init, { start, command } from "./lightcraft_web.js";
    import * as folders from "./folders.js";
    // linked folders (folders.js): the wasm module calls these; permission comes back on the first click
    globalThis.ppcraftFolders = folders;
    addEventListener("pointerdown", () => folders.reconnect(), { once: true });
    // a drag inside the page (a slider, selected text, the canvas) must not start the browser's own drag and drop:
    // it would show as files hovering over the app. Files dragged in from the desktop don't fire dragstart here.
    addEventListener("dragstart", (e) => e.preventDefault());
    (async () => {
      // The Chinese font is a separate file: embedding it would exceed the host's WASM size limit.
      // Font-free development builds can still run, with the same missing-glyph warning as before.
      const chineseFont = fetch("./lightcraft_zh_hans.otf")
        .then(async response => response.ok ? new Uint8Array(await response.arrayBuffer()) : new Uint8Array())
        .catch(() => new Uint8Array());
      // Compile once; the render workers (worker.js) instantiate the same compiled module.
      const [module, font] = await Promise.all([
        WebAssembly.compileStreaming(fetch("./lightcraft_web_bg.wasm")),
        chineseFont,
      ]);
      globalThis.lightcraftModule = module;
      await init({ module_or_path: module });
      // automation: `await lightcraft.command("library.info", "{}")` → JSON text
      globalThis.lightcraft = { command };
      start(font);
    })().catch((e) => {
      console.error(e);
      const el = document.getElementById("lightcraft_loading");
      if (el) el.textContent = "PPcraft failed to load: " + e;
    });
  </script>
</body>
</html>
